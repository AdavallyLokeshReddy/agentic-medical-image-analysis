# Render blueprint for the API. The frontend is a static export (see DEPLOY.md).
services:
  - type: web
    name: agentic-medical-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r ../requirements-api.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CORS_ORIGINS
        sync: false   # set to your frontend origin, e.g. https://your-app.vercel.app
